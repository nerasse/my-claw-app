name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    name: Lint, Types & Tests
    runs-on: debian-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        run: |
          apt-get update
          apt-get install -y curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y nodejs
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency security patches
        run: npm run check:dependency-patches

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      # Two workers, not the default cpus-1. Four heavy RN suites landing together on a
      # contended runner each took ~132 s instead of ~33 s, and every test that crossed the
      # 60 s timeout inside them failed: run #180 was 20 red tests, all timeouts, none a
      # real failure. Raising the timeout is what was tried twice before (5s -> 30s -> 60s);
      # it treats the symptom. Halving the concurrency is what keeps a single test's wall
      # clock under the limit. Costs ~8 s on an idle box, measured.
      - name: Unit tests
        run: npm test -- --ci --maxWorkers=2

  web:
    name: Web bundle
    runs-on: debian-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        run: |
          apt-get update
          apt-get install -y curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y nodejs

      - name: Install dependencies
        run: npm ci

      # The same Metro that builds the Android bundle, with the web config: a resolution that
      # breaks on the web target must fail here rather than at `myclaw web install`.
      - name: Build the web bundle
        run: npm run build:web

      # The check that matters: react-native-web must not have leaked into anything Android.
      - name: Prove the bundles stay apart
        run: |
          grep -q "react-native-web" dist-web/index.js
          test ! -f android/app/build/generated/assets/react/release/index.android.bundle

      - name: Package
        run: tar -czf dist-web.tar.gz dist-web

      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: dist-web
          path: dist-web.tar.gz
