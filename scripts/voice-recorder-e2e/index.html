<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voice recorder gesture test</title>
<style>html,body,#root{margin:0;width:100%;height:100%;overflow:hidden}#root{display:flex}body{font-family:system-ui}</style>
</head><body><div id="root"></div><script>
// Only microphone acquisition is simulated. The app's recorder, Blob and MediaRecorder are real.
Object.defineProperty(navigator, 'mediaDevices', { configurable: true, value: {
  getUserMedia: async () => {
    await new Promise(resolve => setTimeout(resolve, window.voiceTest?.delay ?? 0));
    const context = new AudioContext();
    await context.resume();
    const destination = context.createMediaStreamDestination();
    const source = context.createOscillator();
    source.connect(destination);
    source.start();
    for (const track of destination.stream.getTracks()) {
      const stop = track.stop.bind(track);
      track.stop = () => { stop(); source.stop(); context.close(); };
    }
    return destination.stream;
  }
} });
</script><script src="index.js"></script></body></html>
