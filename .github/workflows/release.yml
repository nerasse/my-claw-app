name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # Android refuses an update whose versionCode did not move, whatever the versionName says:
      # 0.6.237 shipped with 0.6.236's code and could not install. The previous tag is the
      # comparison; a dispatch has no tag, so it skips.
      - name: Verify versionCode moved
        if: github.event_name == 'push'
        run: |
          previous="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -z "$previous" ]; then
            echo "no previous release tag, nothing to compare"
            exit 0
          fi
          before="$(git show "${previous}:android/app/build.gradle" | sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' | head -1)"
          now="$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' android/app/build.gradle | head -1)"
          echo "versionCode ${before:-none} -> ${now:-none} (previous tag ${previous})"
          if [ -z "$before" ] || [ -z "$now" ]; then
            echo "could not read both versionCodes" >&2
            exit 1
          fi
          if [ "$now" -le "$before" ]; then
            echo "versionCode must increase: ${now} <= ${before}; Android refuses the update" >&2
            exit 1
          fi

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency security patches
        run: npm run check:dependency-patches

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci --maxWorkers=2

  web:
    name: Web bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the web bundle
        run: npm run build:web

      - name: Prove react-native-web stayed out of the app bundle
        run: |
          grep -q "react-native-web" dist-web/index.js
          test ! -f android/app/build/generated/assets/react/release/index.android.bundle

      - name: Package
        run: tar -czf dist-web.tar.gz dist-web

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: web
          path: dist-web.tar.gz
          if-no-files-found: error

  apk:
    name: Unsigned release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6.4.1

      - name: Install dependencies
        run: npm ci

      - name: Build the release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  publish:
    name: Sign and publish
    needs: [verify, web, apk]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - name: Download the APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: apk
          path: unsigned

      - name: Download the web bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: web
          path: web

      - name: Sign the APK
        # Same invocation as scripts/release.sh: the lineage and both signers have to be applied
        # identically, or a phone that already has the app refuses the update.
        env:
          KEYSTORE_B64: ${{ secrets.MY_CLAW_APP_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.MY_CLAW_APP_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_B64:?MY_CLAW_APP_KEYSTORE_B64 is missing}"
          : "${KEYSTORE_PASS:?MY_CLAW_APP_KEYSTORE_PASS is missing}"

          version=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' android/app/build.gradle | head -1)
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match versionName v${version}" >&2
            exit 1
          fi

          keystore="${RUNNER_TEMP}/release.jks"
          printf '%s' "${KEYSTORE_B64}" | base64 -d > "${keystore}"
          chmod 600 "${keystore}"

          export MY_CLAW_APP_KEYSTORE_PASS="${KEYSTORE_PASS}"
          key_alias="my-claw-app"
          lineage="android/app/signing/lineage.bin"
          unsigned="unsigned/app-release-unsigned.apk"
          out="my-claw-app-v${version}.apk"
          debug_fingerprint="fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c"

          apksigner=$(ls -1 "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner | sort -V | tail -1)
          [ -x "${apksigner}" ] || { echo "apksigner not found under ${ANDROID_HOME:-/usr/local/lib/android/sdk}" >&2; exit 1; }

          "${apksigner}" sign \
            --ks android/app/debug.keystore --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --next-signer --ks "${keystore}" --ks-key-alias "${key_alias}" \
            --ks-pass env:MY_CLAW_APP_KEYSTORE_PASS --key-pass env:MY_CLAW_APP_KEYSTORE_PASS \
            --lineage "${lineage}" --rotation-min-sdk-version 28 --min-sdk-version 24 \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "${out}" "${unsigned}"

          expected=$(keytool -list -keystore "${keystore}" -storepass:env MY_CLAW_APP_KEYSTORE_PASS \
            -alias "${key_alias}" -v | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          current=$("${apksigner}" verify --min-sdk-version 28 --print-certs "${out}" \
            | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          unset MY_CLAW_APP_KEYSTORE_PASS

          if [ -z "${current}" ] || [ "${current}" = "${debug_fingerprint}" ] || [ "${current}" != "${expected}" ]; then
            echo "refusing to publish: signer ${current:-none} is not ${expected}" >&2
            exit 1
          fi
          echo "signed with ${current:0:16}..."

      - name: Create the draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' android/app/build.gradle | head -1)
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "my-claw-app ${version}" \
            --notes "Android app ${GITHUB_REF_NAME} and the web bundle the server serves." \
            "my-claw-app-v${version}.apk" \
            web/dist-web.tar.gz

      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false

      - name: Keep the signed APK on a manual run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: signed-apk
          path: my-claw-app-*.apk
          if-no-files-found: error
