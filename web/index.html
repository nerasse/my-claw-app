<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- interactive-widget=resizes-content: Chrome Android went back to resizing only the *visual*
     viewport (108), so a layout sized in percentages keeps its height when the keyboard opens and
the field under it is covered. react-native-web's KeyboardAvoidingView is a stub that does
nothing, so on the web this meta tag is the whole keyboard avoidance. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="color-scheme" content="dark light" />
<meta name="theme-color" content="#0b0d10" />
<title>MyClaw</title>
<!-- use-credentials: a manifest is fetched with credentials omitted by default, and every route
     here is behind a session cookie, so the default fetch comes back 401 and the app is not
     installable. -->
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<!-- The first paint, before the bundle has a theme: follow the system so a light desktop does
     not flash a dark rectangle on every load. -->
<!-- overflow:hidden on html and body: the app owns the viewport. A reader that renders taller
     than the window (a long document, a table) must scroll inside its own pane; without this
     the document grew the page instead, and one wheel past the end of a file carried the whole
     interface up -- left column, top bar and all (owner, 2026-10-28). overscroll-behavior keeps
     a trackpad's fling from rubber-banding the page behind the panes. -->
<style>
html,body{height:100%;margin:0;background:#ffffff;overflow:hidden;overscroll-behavior:none}
#root{height:100%;min-height:0;overflow:hidden;display:flex;flex-direction:column}
@media (prefers-color-scheme: dark){html,body,#root{background:#0b0d10}}
</style>
</head>
<body>
<div id="root"></div>
<!-- Absolute, not relative: the client routes on /t/<thread>, and a relative src would ask the
     server for /t/index.js, get the shell back and try to parse HTML as JavaScript. -->
<script src="/index.js"></script>
</body>
</html>
