<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<meta name="theme-color" content="#0b0d10" />
<title>MyClaw</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<!-- The first paint, before the bundle has a theme: follow the system so a light desktop does
     not flash a dark rectangle on every load. -->
<style>
html,body,#root{height:100%;margin:0;background:#ffffff}
#root{display:flex}
@media (prefers-color-scheme: dark){html,body,#root{background:#0b0d10}}
</style>
</head>
<body>
<div id="root"></div>
<!-- Absolute, not relative: the client routes on /t/<thread>, and a relative src would ask the
     server for /t/index.js, get the shell back and try to parse HTML as JavaScript. -->
<script src="/index.js"></script>
</body>
</html>
