<!doctype html>
<html lang="fr" data-theme="sable" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>my-claw — mobile · conversations</title>
<link rel="stylesheet" href="themes.css">
<link rel="stylesheet" href="phone.css">
<link rel="stylesheet" href="compact.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="phone">
  <div class="pstatus">
    <span>9:41</span>
    <span class="right">
      <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3.5 9.5a13 13 0 0117 0M6.5 13a8.5 8.5 0 0111 0M9.5 16.4a4 4 0 015 0"/><circle cx="12" cy="19.6" r="1" fill="currentColor" stroke="none"/></svg>
      <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="8.5" width="17" height="7" rx="2"/><rect x="4.5" y="10.5" width="10.5" height="3" rx="1" fill="currentColor" stroke="none"/><path d="M21.3 11.2v1.6" stroke-linecap="round"/></svg>
      84%
    </span>
  </div>

  <div class="pbar" style="padding-left:14px">
    <div class="block"><div class="t" style="font-size:19px">my-claw</div></div>
    <button class="action" aria-label="Nouveau dossier">
      <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7.5A2 2 0 015.5 5.5h3.2a2 2 0 011.5.7l1.1 1.3h7.2a2 2 0 012 2v7a2 2 0 01-2 2h-13a2 2 0 01-2-2z"/><path d="M12 11.5v4M10 13.5h4"/></svg>
    </button>
    <button class="action primary" aria-label="Nouvelle conversation">
      <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5.5v13M5.5 12h13"/></svg>
    </button>
  </div>

  <div class="psearch">
    <svg class="i-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    <input type="search" placeholder="Rechercher" aria-label="Rechercher">
  </div>

  <div class="plist">
    <div class="group"><span class="t">Aujourd'hui</span><span class="n">4</span></div>

    <button class="row active">
      <div class="row-top">
        <span class="ring"></span>
        <span class="row-title">Refonte UI — trois directions</span>
        <span class="row-time">14:02</span>
      </div>
      <div class="row-meta"><span>my-claw</span><span class="sep">·</span><span>41 msg</span></div>
    </button>

    <button class="row">
      <div class="row-top">
        <span class="spot unread"></span>
        <span class="row-title">Refonte page téléchargements</span>
        <span class="row-time">11:38</span>
      </div>
      <div class="row-meta"><span class="chip">dl-hub</span><span class="sep">·</span><span>brouillon</span></div>
    </button>

    <button class="row">
      <div class="row-top">
        <span class="spot warn"></span>
        <span class="row-title">Quotas : fenêtre 5 h fantôme</span>
        <span class="row-time">08:47</span>
      </div>
      <div class="row-meta"><span>synthetic</span><span class="sep">·</span><span>reset dans 2 j</span></div>
    </button>

    <button class="row">
      <div class="row-top">
        <span class="row-title">Proxy navigateur par contexte</span>
        <span class="row-time">09:12</span>
      </div>
    </button>

    <button class="row" aria-expanded="false">
      <div class="row-top">
        <svg class="i-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="color:var(--faint)"><path d="M8.5 5.5l6.5 6.5-6.5 6.5"/></svg>
        <svg class="i-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="color:var(--faint)"><path d="M3.5 7.5A2 2 0 015.5 5.5h3.2a2 2 0 011.5.7l1.1 1.3h7.2a2 2 0 012 2v7a2 2 0 01-2 2h-13a2 2 0 01-2-2z"/></svg>
        <span class="row-title" style="color:var(--muted)">Infra</span>
        <span class="folder-count">6</span>
      </div>
    </button>

    <div class="group"><span class="t">Cette semaine</span><span class="n">3</span></div>

    <button class="row">
      <div class="row-top">
        <span class="row-title">Cache : ratio réel par provider</span>
        <span class="row-time">hier</span>
      </div>
      <div class="row-meta"><span>stats</span><span class="sep">·</span><span>58 msg</span></div>
    </button>

    <button class="row">
      <div class="row-top">
        <span class="row-title">brag : présentation unique</span>
        <span class="row-time">hier</span>
      </div>
    </button>

    <div class="group"><span class="t">Archives</span><span class="n">128</span></div>
  </div>

  <div class="pfoot">
    <button class="pmore" aria-label="Plus">
      <span class="plabel">
        <span class="pt">Plus</span>
        <span class="ps"><span class="pdot"></span>connecté</span>
      </span>
      <svg class="i-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="color:var(--faint)"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <button class="action" aria-label="Réglages">
      <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.56V21a2 2 0 11-4 0v-.09A1.7 1.7 0 009 19.4a1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.7 1.7 0 004.6 15a1.7 1.7 0 00-1.56-1H3a2 2 0 110-4h.09A1.7 1.7 0 004.6 9a1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06A1.7 1.7 0 009 4.6a1.7 1.7 0 001-1.56V3a2 2 0 114 0v.09A1.7 1.7 0 0015 4.6a1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06A1.7 1.7 0 0019.4 9v0a1.7 1.7 0 001.56 1H21a2 2 0 110 4h-.09a1.7 1.7 0 00-1.51 1z"/></svg>
    </button>
  </div>
  <div class="home"></div>
</div>
<script>
/* Le mobile ne choisit pas son thème non plus : il lit ?theme= / ?mode= pour une
   capture, sinon la préférence posée dans Réglages › Apparence. */
(function () {
  var q = new URLSearchParams(location.search);
  var saved = null;
  try { saved = localStorage.getItem('myclaw-theme'); } catch (e) {}
  document.documentElement.setAttribute('data-theme', q.get('theme') || (saved ? saved.split(':')[0] : 'sable'));
  document.documentElement.setAttribute('data-mode', q.get('mode') || (saved ? saved.split(':')[1] : 'light'));
})();
</script>
</body>
</html>
